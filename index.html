<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperbeam VM</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #0d1117; color: #c9d1d9; }
  header { padding: 10px 16px; background: #161b22; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; gap: 12px; }
  .controls { display: flex; align-items: center; gap: 8px; }
  button { padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(240,246,252,0.1); cursor: pointer; font-weight: 600; font-size: 13px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #startBtn { background: #238636; color: #fff; }
  #stopBtn { background: #da3633; color: #fff; }
  #clearProfileBtn { background: #21262d; color: #8b949e; border-color: #30363d; }
  .meta { display: flex; align-items: center; gap: 10px; font-size: 12px; font-family: ui-monospace, monospace; }
  #status { color: #8b949e; }
  #profileTag { background: #0d1117; padding: 2px 6px; border-radius: 4px; border: 1px solid #30363d; color: #58a6ff; }
  iframe { flex: 1; border: none; background: #000; width: 100%; }
</style>
</head>
<body>

<header>
  <div class="controls">
    <button id="startBtn">Start VM</button>
    <button id="stopBtn" disabled>Stop VM</button>
    <button id="clearProfileBtn" title="Wipe stored profile">New Profile</button>
  </div>
  <div class="meta">
    <span id="profileTag">profile: none</span>
    <span id="status">idle</span>
  </div>
</header>

<iframe id="vmFrame" allow="camera; microphone; display-capture; autoplay; clipboard-read; clipboard-write; fullscreen"></iframe>

<script>
  const WORKER_URL = 'https://tight-brook-82e6.leongwilhelm.workers.dev/';

  const frame = document.getElementById('vmFrame');
  const statusEl = document.getElementById('status');
  const profileTag = document.getElementById('profileTag');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const clearBtn = document.getElementById('clearProfileBtn');

  function updateProfileDisplay() {
    const pid = localStorage.getItem('hb_profile_id');
    profileTag.textContent = pid ? `profile: ${pid.slice(0, 12)}...` : 'profile: none (new)';
  }

  async function startVM() {
    startBtn.disabled = true;
    stopBtn.disabled = true;
    statusEl.textContent = 'requesting vm...';

    const savedProfileId = localStorage.getItem('hb_profile_id') || null;

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ profile_id: savedProfileId })
      });

      const data = await res.json();

      if (!res.ok) {
        // logs exact hyperbeam schema rejection message
        throw new Error(data.message || data.error || `HTTP ${res.status}`);
      }

      // save the genuine profile id returned by hyperbeam
      if (data.profile && data.profile.id) {
        localStorage.setItem('hb_profile_id', data.profile.id);
        updateProfileDisplay();
      }

      sessionStorage.setItem('hb_session_id', data.session_id);
      frame.src = data.embed_url;
      statusEl.textContent = 'running';
      stopBtn.disabled = false;
    } catch (err) {
      statusEl.textContent = `error: ${err.message}`;
      startBtn.disabled = false;
    }
  }

  async function stopVM() {
    const sessionId = sessionStorage.getItem('hb_session_id');
    if (!sessionId) {
      frame.src = '';
      statusEl.textContent = 'stopped';
      startBtn.disabled = false;
      stopBtn.disabled = true;
      return;
    }

    startBtn.disabled = true;
    stopBtn.disabled = true;
    statusEl.textContent = 'shutting down...';

    try {
      await fetch(WORKER_URL, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId }),
        keepalive: true
      });
    } catch (e) {}

    sessionStorage.removeItem('hb_session_id');
    frame.src = '';
    statusEl.textContent = 'stopped';
    startBtn.disabled = false;
  }

  clearBtn.addEventListener('click', () => {
    localStorage.removeItem('hb_profile_id');
    updateProfileDisplay();
    statusEl.textContent = 'profile cleared';
  });

  startBtn.addEventListener('click', startVM);
  stopBtn.addEventListener('click', stopVM);

  updateProfileDisplay();
</script>
</body>
</html>
