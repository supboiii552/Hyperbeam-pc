<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hyperbeam VM - Credit Saver</title>
<style>
  body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; }
  header { padding: 10px 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
  button { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; margin-right: 10px; }
  #newBtn { background: #2ecc71; color: white; }
  #stopBtn { background: #e74c3c; color: white; }
  iframe { flex: 1; border: none; background: #000; }
  #status { font-size: 13px; color: #999; }
</style>
</head>
<body>

<header>
  <div>
    <button id="newBtn">Start New VM</button>
    <button id="stopBtn">STOP VM (Saves Credits)</button>
    <span id="status">Ready</span>
  </div>
</header>

<iframe id="vmFrame"></iframe>

<script>
  // Updated to your new Worker URL
  const WORKER_URL = 'https://tight-brook-82e6.leongwilhelm.workers.dev/'; 

  const frame = document.getElementById('vmFrame');
  const status = document.getElementById('status');

  async function startVM() {
    // If a session is already stored, use it instead of starting a new one
    const savedUrl = localStorage.getItem('hb_url');
    if (savedUrl) {
      frame.src = savedUrl;
      status.textContent = "Resumed session.";
      return;
    }

    status.textContent = "Spawning VM...";
    try {
      const res = await fetch(WORKER_URL);
      const data = await res.json();
      if (data.embed_url) {
        localStorage.setItem('hb_url', data.embed_url);
        localStorage.setItem('hb_id', data.session_id);
        frame.src = data.embed_url;
        status.textContent = "VM Running";
      }
    } catch (e) { status.textContent = "Error."; }
  }

  async function stopVM() {
    const id = localStorage.getItem('hb_id');
    if (!id) return;

    // This sends the "Kill" signal to your worker
    await fetch(WORKER_URL, {
      method: 'DELETE',
      body: JSON.stringify({ session_id: id }),
      keepalive: true // Crucial: lets the request finish even if you close the tab
    });

    localStorage.clear();
    frame.src = "";
    status.textContent = "VM Terminated.";
  }

  // Auto-stop when tab is closed or page is refreshed
  window.addEventListener('beforeunload', () => {
    stopVM();
  });

  document.getElementById('newBtn').addEventListener('click', async () => {
    await stopVM();
    startVM();
  });

  document.getElementById('stopBtn').addEventListener('click', stopVM);

  startVM();
</script>
</body>
</html>
